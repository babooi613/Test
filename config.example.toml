# memebot configuration. Copy to config.toml and adjust.
# Every value shown is the default; delete any line you don't want to change.

[general]
mode = "paper"              # "paper" (simulated) or "live" (real funds, also needs --live)
poll_interval_sec = 30
state_file = "state/state.json"
log_level = "INFO"
kill_switch_file = "STOP"   # `touch STOP` to pause new entries; bot exits once flat

[discovery]
chain = "solana"
use_latest_profiles = true  # DexScreener latest token profiles
use_latest_boosts = true    # DexScreener latest boosted tokens
watchlist = []              # token mint addresses to always evaluate
max_candidates_per_tick = 60

[filters]
min_liquidity_usd = 20000
max_liquidity_usd = 5000000
min_fdv_usd = 50000
max_fdv_usd = 20000000
min_age_minutes = 15        # skip the first minutes after launch (snipers / bundles)
max_age_hours = 72
min_volume_h1_usd = 10000
min_txns_h1 = 100
min_buy_ratio_h1 = 0.55
min_price_change_h1 = 0.0
max_price_change_h1 = 300.0
max_price_change_m5 = 40.0
allowed_quote_symbols = ["SOL", "USDC"]
blacklist = []
use_rugcheck = true         # query rugcheck.xyz before buying
rugcheck_max_score = 1000
rugcheck_reject_danger = true

[strategy]
min_score = 55.0
take_profit_pct = 100.0
stop_loss_pct = 25.0
trailing_activation_pct = 40.0
trailing_stop_pct = 20.0
max_hold_minutes = 240
liquidity_drop_exit_pct = 50.0
cooldown_minutes = 120

[risk]
position_size_usd = 25.0
max_open_positions = 4
max_total_exposure_usd = 100.0
daily_loss_limit_usd = 50.0
max_entries_per_tick = 1

[paper]
starting_cash_usd = 1000.0
slippage_pct = 1.5
fee_pct = 0.5

[live]
rpc_url = "https://api.mainnet-beta.solana.com"   # use a private RPC (Helius, Triton, ...) for reliability
jupiter_base_url = "https://lite-api.jup.ag"
slippage_bps = 300
max_price_impact_pct = 3.0
priority_fee_lamports = "auto"
private_key_env = "MEMEBOT_PRIVATE_KEY"            # env var holding base58 key or path to id.json
min_sol_reserve = 0.02
confirm_timeout_sec = 60

# ---------------------------------------------------------------------------
# Real-time sniper for pump.fun Mayhem coins:  python -m memebot snipe
# All amounts are in SOL. Exits are re-checked on EVERY trade tick.
# ---------------------------------------------------------------------------
[sniper]
feed_url = "wss://pumpportal.fun/api/data"
trade_api_url = "https://pumpportal.fun/api/trade-local"
state_file = "state/sniper.json"
only_mayhem = true
mayhem_keys = ["isMayhemMode", "is_mayhem_mode", "mayhemMode", "mayhem"]
mayhem_check_onchain = true   # read is_mayhem_mode from the bonding curve via [live] rpc_url
creator_blacklist = []
bot_wallet_min_coins = 4          # wallets buying >= N coins in the window count as bots (0 = off)
bot_wallet_window_sec = 900.0
record_events = true              # log every feed event for `memebot backtest`
events_dir = "state/events"
record_extra_sec = 600.0

# entry: only buy launches whose first seconds look like organic demand
min_age_sec = 3.0
max_age_sec = 45.0
min_buys = 8
min_unique_buyers = 6
min_buy_volume_sol = 1.5
min_buy_volume_ratio = 0.70
max_top_buyer_share = 0.40
min_mcap_sol = 0.0
max_mcap_sol = 150.0
max_gain_since_launch_pct = 150.0
require_dev_holding = true

# exits
take_profit_pct = 35.0
stop_loss_pct = 20.0
trailing_activation_pct = 20.0
trailing_stop_pct = 12.0
max_hold_sec = 120.0
exit_on_dev_sell = true

# sizing & risk
buy_sol = 0.05
max_open_positions = 3
daily_loss_limit_sol = 0.5
watch_ttl_sec = 90.0

# paper simulation
paper_starting_sol = 5.0
paper_fee_pct = 1.25
paper_latency_slippage_pct = 3.0

# live execution (uses [live] rpc_url / private_key_env / min_sol_reserve too)
slippage_pct = 15
priority_fee_sol = 0.0005
pool = "auto"

# ---------------------------------------------------------------------------
# Graduated coins: trade right after a coin completes its bonding curve and
# migrates to PumpSwap. Same keys as [sniper]; ages are seconds since migration.
# Shares max_open_positions / daily_loss_limit_sol / paper balance with [sniper].
# ---------------------------------------------------------------------------
[graduated]
enabled = true
min_age_sec = 5.0
max_age_sec = 300.0
min_buys = 15
min_unique_buyers = 10
min_buy_volume_sol = 5.0
min_buy_volume_ratio = 0.60
max_top_buyer_share = 0.35
max_mcap_sol = 5000.0
max_gain_since_launch_pct = 100.0
take_profit_pct = 30.0
stop_loss_pct = 15.0
trailing_activation_pct = 15.0
trailing_stop_pct = 10.0
max_hold_sec = 300.0
buy_sol = 0.05
watch_ttl_sec = 330.0
paper_fee_pct = 0.5
paper_latency_slippage_pct = 2.0
